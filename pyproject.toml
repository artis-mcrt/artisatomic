[build-system]
requires = [
    "setuptools>=82.0.1",
    "setuptools_scm>=10.0.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "artisatomic"
authors = [
    { name = "Luke J. Shingles", email = "luke.shingles@gmail.com" },
    { name = "ARTIS Collaboration", email = "luke.shingles@gmail.com" },
]
description = "Tools to create an atomic database for use with ARTIS."
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["version"]
readme = { file = "README.md", content-type = 'text/markdown' }
dependencies = [
    "argcomplete>=3.5.1",
    "artistools>=2026.4.14",
    "chiantipy>=0.15.1",
    "h5py>=3.10.0",
    "numpy>=2.2.6",
    "pandas[compression,hdf5]>=3.0.3",
    "polars>=1.37.1",
    "pyarrow>=18.1.0",
    "requests>=2.34.0",
    "scipy>=1.15.3",
    "tqdm>=4.70.0",
    "xopen>=2.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "matplotlib>=3.10.7",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "pip>=25.2",
    "prek>=0.1.6",
    "pyrefly>=1.2.0",
    "pytest>=8.3.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
    "types-pytz>=2025.2.0.20250809",
    "types-requests>=2.32.0.20241016",
    "types-tqdm>=4.70.0.20260731",
]

[project.urls]
Repository = "https://www.github.com/artis-mcrt/artisatomic"
Source = "https://www.github.com/artis-mcrt/artisatomic"

[project.scripts]
makeartisatomicfiles = "artisatomic:main"
makerecombratefile = "artisatomic.makerecombratefile:main"

[tool.mypy]
python_executable = ".venv/bin/python3"
python_version = '3.13'
exclude = "(build)|(tests)"
packages = "artisatomic"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pyrefly]
preset = "strict"
project-excludes = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    'build',
    'dist',
    'target',
    '**/_version.py',
    '**/.venv',
    '**/rd_cmfgen.py',
]
python-interpreter-path = ".venv/bin/python3"

[tool.pyrefly.errors]
# these stay off because they fire in the hundreds on unannotated function parameters and
# lambdas, which ruff's ANN001 also allows; everything else in the strict preset is enabled
# and individual exceptions are suppressed at the line that needs them
implicit-any-parameter = false
implicit-any-lambda = false

[tool.pyright]
deprecateTypingAliases = true
enableTypeIgnoreComments = false # leave these for mypy to interpret
exclude = [
    '**/node_modules',
    '**/__pycache__',
    '**/.*',
    'build',
    'dist',
    'target',
    '**/_version.py',
    '.venv',
]
reportAttributeAccessIssue = true
reportCallIssue = true
reportDeprecated = true
reportMissingImports = true
reportMissingTypeStubs = true
reportOptionalMemberAccess = true
reportPossiblyUnboundVariable = true
reportUnnecessaryTypeIgnoreComment = true
# the untyped parts of the pandas/numpy/polars APIs make this ~450 errors of pure noise
reportUnknownVariableType = false
reportUnreachable = true
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
pythonVersion = "3.13"

[tool.ruff]
line-length = 120
fix = true
show-fixes = true
extend-exclude = ["_version.py"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # every float comparison here is deliberate: a divide-by-zero guard, a validation of an exact
    # value read from a data file, or a sentinel against a value that was literally assigned 0.0
    # (a photoionisation threshold of exactly zero means "no data for this level")
    "float-equality-comparison",
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "non-empty-init-module",
    "any-type",
    "strip-with-multi-characters",
    "unused-loop-control-variable",
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "line-too-long",
    # a Google-style Returns:/Yields:/Raises: section is nearly always a restatement of the summary
    # line for these functions, so say it once in prose instead
    "docstring-missing-returns",
    "docstring-missing-yields",
    "docstring-missing-exception",
    "ambiguous-variable-name",
    "raw-string-in-exception",
    "f-string-in-exception",
    "commented-out-code",
    "unused-variable",
    "FBT",
    "line-contains-todo",
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "mixed-case-variable-in-global-scope",
    "try-except-in-loop",
    "blanket-type-ignore",
    "import-outside-top-level",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-statements",
    "magic-value-comparison",
    "global-statement",
    "redefined-loop-name",
    "os-path-abspath",
    "os-makedirs",
    "os-path-isfile",
    "os-path-join",
    "os-path-dirname",
    "builtin-open",
    "glob",
    "collections-named-tuple",
    "unnecessary-assign",
    "assert",
    "hardcoded-password-string",
    "open-file-with-context-handler",
    "print",
    "missing-todo-author",
    "missing-todo-link",
    "missing-todo-colon",
    "missing-todo-description",
    "raise-vanilla-args",
]
fixable = ["ALL"]
unfixable = [
    "unused-noqa",
    "expr-or-true",
    "expr-and-false",
    "empty-type-checking-block",
    "unused-import",
]

[tool.ruff.lint.pydocstyle]
# Resolves the D203/D211 and D212/D213 conflicts that selecting the whole D group creates, and
# leaves Args/Returns/Raises sections optional.
convention = "pep257"

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["artisatomic*"]

[tool.setuptools_scm]
write_to = "_version.py"
local_scheme = "no-local-version"

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
addopts = "--cov=artisatomic --cov-report=xml:coverage.xml --cov-report=term-missing"

[tool.coverage.run]
source = ["artisatomic"]
omit = ["artisatomic/test_artisatomic.py"]

[tool.coverage.report]
skip_covered = false
