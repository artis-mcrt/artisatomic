---
# prek install installs these hook types. The uv-sync hook runs after a checkout, a merge and a rewrite.
default_install_hook_types: [pre-commit, post-checkout, post-merge, post-rewrite]
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-ast
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: check-merge-conflict
          - id: check-toml
          - id: check-yaml
          - id: detect-private-key
          - id: destroyed-symlinks
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
            args: [--fix=lf]
            # the downloaded source files must stay byte-identical to the published data
            exclude: ^atomic-data-chargetransfer/
          - id: trailing-whitespace
            # the downloaded source files must stay byte-identical to the published data
            exclude: ^atomic-data-chargetransfer/
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.3
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.13.6
      hooks:
          - id: uv-lock
          # the command of the Setup section of AGENTS.md: the project in editable mode, and no extra
          - id: uv-sync
            args: [--frozen]

ci:
    autoupdate_schedule: quarterly
